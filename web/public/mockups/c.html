<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option C · Analyst board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#f4f5f7; --card:#fff; --ink:#1a1d23; --dim:#6a7280; --line:#e2e5ea; --blue:#2457d6; --good:#1f9d57; --warn:#d9930d; --bad:#d23f3a; }
* { box-sizing:border-box; } html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:13px/1.4 'IBM Plex Sans',system-ui,sans-serif; font-variant-numeric:tabular-nums; }
.app { height:100%; display:grid; grid-template-columns:240px minmax(0,1fr) 520px; gap:10px; padding:10px; }
.col { min-height:0; display:flex; flex-direction:column; gap:10px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-height:0; }
.card h3 { margin:0 0 8px; font:500 11px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); display:flex; justify-content:space-between; }
.scroll { overflow:auto; flex:1; }
/* timeline */
.tl { display:grid; grid-template-columns:1fr; gap:4px; } .tl button { text-align:left; border:1px solid transparent; background:none; border-radius:6px; padding:6px 8px; cursor:pointer; font:inherit; color:var(--ink); }
.tl button.on { background:#eef3ff; border-color:#c9d7fb; } .tl b { font-weight:600; } .tl .pk { display:block; color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tl .mini { height:4px; background:var(--bad); border-radius:2px; margin-top:4px; overflow:hidden; } .tl .mini i { display:block; height:100%; background:var(--good); }
.spark svg { width:100%; height:90px; display:block; }
/* arena */
.arena { display:grid; grid-template-columns:22px 1fr; gap:10px; }
.eval { position:relative; background:var(--bad); border-radius:4px; overflow:hidden; } .eval i { position:absolute; left:0; right:0; bottom:0; background:var(--good); } .eval span { position:absolute; left:0; right:0; text-align:center; font:500 10px 'IBM Plex Mono'; color:#fff; }
.board { display:grid; grid-template-rows:1fr auto 1fr; gap:6px; }
.side { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .side h4 { grid-column:1 / span 2; margin:0; font:500 11px 'IBM Plex Mono'; text-transform:uppercase; color:var(--dim); letter-spacing:.06em; }
.unit { display:grid; grid-template-columns:84px 1fr; gap:8px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:6px; background:#fbfbfd; }
.unit.us { border-left:4px solid var(--blue); } .unit.foe { border-left:4px solid var(--bad); }
.unit .spr { max-width:84px; max-height:84px; } .unit b { font-weight:600; } .unit .hp { height:6px; background:#e7eaf0; border-radius:3px; margin:4px 0; overflow:hidden; } .unit .hp i { display:block; height:100%; } .unit .sub { color:var(--dim); font-size:12px; }
.act { display:inline-block; margin-top:3px; font:500 11px 'IBM Plex Mono'; background:var(--blue); color:#fff; padding:1px 8px; border-radius:4px; }
.conds { display:flex; gap:6px; justify-content:center; font:500 11px 'IBM Plex Mono'; color:var(--dim); } .conds span { background:#eef0f4; padding:1px 8px; border-radius:4px; }
.bench { display:flex; gap:3px; align-items:center; margin-top:4px; } .ico { width:28px; height:28px; object-fit:contain; } .ico.down { filter:grayscale(1); opacity:.3; } .ico.dim { opacity:.4; }
ul.log { list-style:none; margin:0; padding:0; } ul.log li { padding:2px 0 2px 8px; border-left:3px solid var(--line); margin:2px 0; } ul.log li.ours { border-color:var(--blue); } ul.log li.foe { border-color:var(--bad); } ul.log li.turn { border-color:var(--ink); font-weight:600; } ul.log li.field { color:var(--dim); }
/* engine */
.line { display:grid; grid-template-columns:22px 1fr 56px 56px; gap:6px; align-items:center; padding:5px 0; border-top:1px solid var(--line); font-size:12.5px; } .line:first-of-type { border-top:0; } .line .n { font:500 11px 'IBM Plex Mono'; color:var(--dim); }
.line.pick { background:#eef3ff; margin:0 -8px; padding:5px 8px; border-radius:6px; } .line .v { text-align:right; font:500 12px 'IBM Plex Mono'; } .line .v small { display:block; color:var(--dim); font-size:10px; }
.bar { height:6px; background:#e7eaf0; border-radius:3px; overflow:hidden; margin-top:3px; } .bar i { display:block; height:100%; background:var(--blue); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .pred b { font-weight:600; } .pred .r { display:flex; justify-content:space-between; font-size:12.5px; } .pred .bar i { background:var(--bad); }
.mx { overflow:auto; } .mx table { border-collapse:collapse; font:400 11px 'IBM Plex Mono',monospace; } .mx th,.mx td { border:1px solid var(--line); padding:2px 6px; text-align:right; white-space:nowrap; } .mx th { color:var(--dim); font-weight:500; max-width:84px; overflow:hidden; text-overflow:ellipsis; font-family:'IBM Plex Sans'; } .mx td.plan { text-align:left; font-family:'IBM Plex Sans'; font-size:12px; white-space:normal; min-width:200px; } .mx tr.pick td.plan { font-weight:600; box-shadow:inset 3px 0 var(--blue); } .strong { font-weight:600; }
.quiet { color:var(--dim); font-size:12px; margin:4px 0; }
.dmg { display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:12.5px; } .dmg .k { color:var(--bad); font-weight:600; }
</style></head>
<body><div class="app" id="app"></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
function spark(i) {
  const ws = winSeries(), W = 216, H = 90, n = S.length;
  const x = (j) => 8 + (j * (W - 16)) / Math.max(n - 1, 1), y = (v) => 6 + (1 - v) * (H - 12);
  const pts = ws.map((v, j) => `${x(j)},${y(v ?? 0.5)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${y(.5)}" y2="${y(.5)}" stroke="var(--line)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2"/>${ws.map((v, j) => `<circle cx="${x(j)}" cy="${y(v ?? .5)}" r="${j === i ? 5 : 2.5}" fill="${j === i ? 'var(--blue)' : '#fff'}" stroke="var(--blue)" stroke-width="1.5"/>`).join('')}</svg>`;
}
function unit(m, side, pickLabel) {
  if (!m) return '<div class="unit"></div>';
  const boosts = Object.entries(m.boosts || {}).map(([k, v]) => `${k}${v > 0 ? '+' : ''}${v}`).join(' ');
  return `<div class="unit ${side}">${sprite(m.name, side === 'us')}<div><b>${esc(m.name)}</b> <span class="sub">${pct(m.hp)}${m.status ? ' · ' + esc(m.status) : ''}${boosts ? ' · ' + boosts : ''}</span><div class="hp"><i style="width:${m.hp * 100}%;background:${hpColor(m.hp)}"></i></div>
    <div class="sub">${[m.item, m.ability].filter(Boolean).map(esc).join(' · ') || (side === 'us' ? '' : 'item and ability unknown')}</div>${(m.moves || []).length ? `<div class="sub">${m.moves.map(esc).join(', ')}</div>` : ''}${pickLabel ? `<span class="act">${esc(pickLabel)}</span>` : ''}</div></div>`;
}
function bench(side, hidden) { return `<div class="bench">${side.map((m) => icon(m.name).replace('class="ico"', `class="ico ${m.fainted ? 'down' : !m.seen && hidden ? 'dim' : ''}"`)).join('')}</div>`; }
function render(i) {
  const s = S[i], b = s.board, pk = picks(s), fo = actives(b.foe), us = actives(b.ours), w = s.thoughts[0] ? s.thoughts[0].winChance : 0.5;
  const pred = s.thoughts.find((t) => t.foePrediction && t.foePrediction.length);
  const a = s.analysis, rows = a ? [...a.rows].sort((x, y) => (y.score ?? -9) - (x.score ?? -9)).slice(0, 5) : [];
  const policyRow = (r, n) => `<div class="line ${a && r.choice === a.choice ? 'pick' : ''}"><span class="n">${n}</span><div>${esc(r.label)}<div class="bar"><i style="width:${r.prior * 100}%"></i></div></div><span class="v">${pct(r.prior)}<small>policy</small></span><span class="v">${r.score == null ? '–' : (r.score >= 0 ? '+' : '') + r.score.toFixed(2)}<small>search</small></span></div>`;
  const damage = s.thoughts.filter((t) => t.actor).map((t) => { const g = moveGroups(t).find((x) => x.name === split(t.chosen)[0]); const tg = g && g.targets.find((x) => x.foe === split(t.chosen)[1]); return tg && tg.damage ? `<div class="dmg"><b>${esc(t.actor)} · ${esc(t.chosen)}</b><span></span>${tg.damage.map((d) => `<span>→ ${esc(d.foe)}</span><span class="${d.sureKo || d.maybeKo ? 'k' : ''}">${pct(d.pctOfCurrentHp)}${d.sureKo ? ' sure KO' : d.maybeKo ? ' may KO' : ''}</span>`).join('')}</div>` : ''; }).join('');
  document.getElementById('app').innerHTML = `
  <div class="col"><div class="card"><h3><span>Win chance</span><span>${pct(w)}</span></h3><div class="spark">${spark(i)}</div></div>
   <div class="card scroll"><h3><span>Decisions</span><span>← → keys</span></h3><div class="tl">${S.map((x, j) => `<button data-step="${j}" class="${j === i ? 'on' : ''}"><b>${stepName(x)}</b><span class="pk">${esc(picks(x).filter(Boolean).map((p) => p.split(' → ')[0]).join(' + ') || 'replacement')}</span><div class="mini"><i style="width:${(x.thoughts[0] ? x.thoughts[0].winChance : .5) * 100}%"></i></div></button>`).join('')}</div></div></div>
  <div class="col"><div class="card"><h3><span>${stepName(s)}</span><span>${[b.weather && 'weather: ' + b.weather, b.terrain && 'terrain: ' + b.terrain, b.trickRoom && 'trick room'].filter(Boolean).join(' · ') || 'no field effects'}</span></h3>
    <div class="arena"><div class="eval"><i style="height:${w * 100}%"></i></div><div class="board">
      <div class="side"><h4>Opponent (hidden info)</h4>${fo.map((m) => unit(m, 'foe')).join('')}</div>
      <div class="conds">${(b.foeConditions || []).map((c) => `<span>foe: ${esc(c)}</span>`).join('')}${(b.ourConditions || []).map((c) => `<span>ours: ${esc(c)}</span>`).join('')}</div>
      <div class="side"><h4>You</h4>${us.map((m, k) => unit(m, 'us', pk[k])).join('')}</div></div></div>
    <div class="bench" style="gap:24px"><span>Ours ${bench(b.ours, false).replace('<div class="bench">', '<span style="display:inline-flex;gap:3px">').replace(/<\/div>$/, '</span>')}</span><span>Theirs ${bench(b.foe, true).replace('<div class="bench">', '<span style="display:inline-flex;gap:3px">').replace(/<\/div>$/, '</span>')}</span></div></div>
   <div class="card scroll"><h3><span>What just happened</span><span>${s.events.length} events</span></h3><ul class="log">${s.events.map(eventLine).join('') || '<li class="field">Opening position.</li>'}</ul></div></div>
  <div class="col"><div class="card"><h3><span>Candidate plans</span><span>policy prior vs one-turn search</span></h3>${rows.length ? rows.map((r, n) => policyRow(r, n + 1)).join('') : `<p class="quiet">${esc(s.thoughts[0] ? s.thoughts[0].chosen : '')} (single sensible set of options; no search).</p>`}</div>
   <div class="card"><div class="two"><div class="pred"><h3>Expected opponent</h3>${pred ? pred.foePrediction.map((f) => `<div style="margin-bottom:8px"><b>${esc(f.foe)}</b>${f.top.slice(0, 3).map((x) => `<div class="r"><span>${esc(x.label)}</span><span>${pct(x.prob)}</span></div><div class="bar"><i style="width:${x.prob * 100}%"></i></div>`).join('')}</div>`).join('') : '<p class="quiet">None this step.</p>'}</div>
     <div><h3>Damage if it works</h3>${damage || '<p class="quiet">No attack chosen.</p>'}</div></div></div>
   <div class="card scroll"><h3><span>Payoff matrix</span><span>ours − theirs, health after 1 turn</span></h3>${matrix(s, { rows: 6, short: false })}</div></div>`;
}
mount(render, 3);
</script></body></html>
